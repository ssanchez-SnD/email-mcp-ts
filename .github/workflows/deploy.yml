name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 72.60.228.139
      DEPLOY_USER: gitci
      DEPLOY_PORT: 22
      DEPLOY_APP_DIR: /opt/email-mcp-ts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy key
        run: |
          echo "DEPLOY_KEY<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.VPS_SSH_KEY }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Validate deploy settings
        run: |
          test -n "${DEPLOY_HOST}" || (echo "Missing VPS host." && exit 1)
          test -n "${DEPLOY_USER}" || (echo "Missing VPS user." && exit 1)
          test -n "${DEPLOY_KEY}" || (echo "Missing VPS private key (secret VPS_SSH_KEY)." && exit 1)
          test -n "${DEPLOY_APP_DIR}" || (echo "Missing app directory." && exit 1)

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -e
            cd ${{ env.DEPLOY_APP_DIR }}
            git pull origin main
            docker compose up -d --build --remove-orphans
            docker image prune -f
            echo "Deploy finished at $(date)"
